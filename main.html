<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form action="/submit" method="post">
      <h1>Feedback form</h1>
      <label for="name">Name :</label>
      <input id="name" type="text" placeholder="Name" required /><br />
      <label for="email">email :</label>
      <input type="email" id="email" placeholder="Email" required /><br />
      <label for="gender_m">male</label>
      <input type="radio" name="gender" id="gender_m" value="male" />
		<label for="gender_f">female</label>
	  <input type="radio" name="gender" id="gender_f" value="Female" /><br />
      <label for="cars">Car Brands :</label>
      <select id="cars"  placeholder="--Please choose an option--" required >
        <option value="">--Please choose an option--</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
      </select><br>
	  <label for="age">Age</label>
      <input id="age" type="number" required placeholder="Age" /><br />
	  <label for="dob">DOB</label>
	  <input id="dob" type="date" required /><br>
	  <label for="tel">Phone Number</label> 
	  <input id="tel" type="tel" placeholder="xxx-xxx-xxxx"/><br>
	  <label for="password">Password</label>
	  <input id="password" type="password"  placeholder="Password"><br>
     <input type="checkbox" id="tos" required><label for="tos">I agree to the TOS</label><br>
	  <button type="submit">submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
